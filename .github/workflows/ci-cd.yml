name: Go CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Install Dependencies
      run: go mod tidy

    - name: Run Tests
      run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Build App
      run: go build ./cmd/main.go

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v3

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker Image
      run: docker build -t jiyanshikeshrii/go-logistics-app .

    - name: Push Docker Image
      run: docker push jiyanshikeshrii/go-logistics-app

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
    - name: Deployment Step
      run: echo "Application deployed using Docker image from Docker Hub"